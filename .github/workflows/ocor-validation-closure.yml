name: OCOR governance and validation closure

on:
  push:
    branches:
      - codex/validation-closure-v1.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ocor
          POSTGRES_PASSWORD: ocor
          POSTGRES_DB: ocor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocor -d ocor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OCOR_LIVE_POSTGRES_DSN: postgresql://ocor:ocor@127.0.0.1:5432/ocor
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and start Fuseki
        run: |
          set -euo pipefail
          docker build -t ocor/jena-fuseki:ci infra/fuseki
          docker run -d --name ocor-bootstrap-fuseki-1 -p 3030:3030 ocor/jena-fuseki:ci
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:3030/$/ping >/dev/null; do sleep 2; done'

      - name: Pre-pull pinned service images (bounded retry)
        run: |
          set -euo pipefail
          pull_with_retry() {
            ref="$1"; attempt=1; max=5
            until docker pull "$ref"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "docker pull failed after ${max} attempts: ${ref}" >&2
                return 1
              fi
              echo "docker pull attempt ${attempt} failed for ${ref}; retrying in $((attempt * attempt))s" >&2
              sleep "$((attempt * attempt))"
              attempt="$((attempt + 1))"
            done
          }
          pull_with_retry typedb/typedb@sha256:7555df2fffd5354553143facbfc81a58ce7036e4cc8b3b50bc7139faff4a721f
          pull_with_retry openpolicyagent/opa@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff
          pull_with_retry quay.io/keycloak/keycloak@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
          pull_with_retry quay.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
          pull_with_retry ghcr.io/spiffe/spire-server@sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141
          pull_with_retry ghcr.io/spiffe/spire-agent@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff

      - name: Start real TypeDB
        run: |
          set -euo pipefail
          docker run -d --name ocor-bootstrap-typedb-1 -p 1729:1729 -p 8000:8000 \
            typedb/typedb@sha256:7555df2fffd5354553143facbfc81a58ce7036e4cc8b3b50bc7139faff4a721f
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 2; done'

      - name: Start real identity/policy control-plane services (OPA, Keycloak, OpenBao)
        run: |
          set -euo pipefail
          docker run -d --name ocor-bootstrap-opa-1 -p 8181:8181 \
            openpolicyagent/opa@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff \
            run --server --addr 0.0.0.0:8181
          docker run -d --name ocor-bootstrap-keycloak-1 -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ocor-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-password \
            quay.io/keycloak/keycloak@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067 \
            start-dev --http-port=8080
          docker run -d --name ocor-bootstrap-openbao-1 -p 8200:8200 --cap-add=IPC_LOCK \
            -e BAO_ADDR=http://127.0.0.1:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID=ci-only-token \
            quay.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641 \
            server -dev -dev-listen-address=0.0.0.0:8200
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8181/health >/dev/null; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080/realms/master/.well-known/openid-configuration >/dev/null; do sleep 3; done'

      - name: Bootstrap SPIRE server and agent (two-phase, digest-pinned)
        run: |
          set -euo pipefail
          mkdir -p .ocor/spire
          openssl req -x509 -newkey rsa:3072 -nodes -days 2 \
            -keyout .ocor/spire/ca.key -out .ocor/spire/ca.crt \
            -subj "/C=IT/O=OCOR Test/CN=OCOR SPIRE Test CA" >/dev/null 2>&1
          chmod 600 .ocor/spire/ca.key
          cat > .ocor/bootstrap.env <<EOF
          OCOR_LOCAL_KEYCLOAK_PASSWORD=ci-only-password
          OCOR_LOCAL_OPENBAO_TOKEN=ci-only-token
          OCOR_LOCAL_POSTGRES_PASSWORD=ocor
          OCOR_LOCAL_TERMINUSDB_PASSWORD=ocor
          OCOR_SPIRE_BOOTSTRAP_DIR=$(pwd)/.ocor/spire
          OCOR_SPIRE_JOIN_TOKEN=bootstrap-pending
          EOF
          chmod 600 .ocor/bootstrap.env

          docker compose --env-file .ocor/bootstrap.env -f deploy/bootstrap/compose.yaml \
            up --detach --wait --wait-timeout 180 spire-server

          TOKEN=$(docker compose --env-file .ocor/bootstrap.env -f deploy/bootstrap/compose.yaml \
            exec -T spire-server /opt/spire/bin/spire-server token generate \
            -socketPath /run/spire/sockets/server.sock -ttl 600 -output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          sed -i "s|^OCOR_SPIRE_JOIN_TOKEN=.*|OCOR_SPIRE_JOIN_TOKEN=${TOKEN}|" .ocor/bootstrap.env

          docker compose --env-file .ocor/bootstrap.env -f deploy/bootstrap/compose.yaml \
            up --detach --wait --wait-timeout 180 spire-agent

          timeout 90 bash -c 'until docker exec ocor-bootstrap-spire-agent-1 \
            /opt/spire/bin/spire-agent healthcheck -socketPath /run/spire/sockets/agent.sock; do sleep 2; done'

          PARENT_ID=$(docker exec ocor-bootstrap-spire-server-1 /opt/spire/bin/spire-server \
            agent list -socketPath /run/spire/sockets/server.sock -output json \
            | python3 -c "import json,sys; a=max(json.load(sys.stdin)['agents'], key=lambda i: int(i.get('x509svid_expires_at', 0))); i=a['id']; print('spiffe://' + i['trust_domain'] + i['path'])")
          docker exec ocor-bootstrap-spire-server-1 /opt/spire/bin/spire-server entry create \
            -socketPath /run/spire/sockets/server.sock \
            -parentID "${PARENT_ID}" \
            -spiffeID spiffe://ocor.test/ocor/control-plane \
            -selector unix:uid:0

          timeout 90 bash -c 'until docker exec ocor-bootstrap-spire-agent-1 \
            /opt/spire/bin/spire-agent api fetch x509 -socketPath /run/spire/sockets/agent.sock >/dev/null 2>&1; do sleep 2; done'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Set up pinned Node oracle
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Synchronize locked runtime environment
        working-directory: ocor-runtime
        run: |
          set -euo pipefail
          uv sync --frozen --extra test
          .venv/bin/python --version
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          for package in ("openapi-spec-validator", "rdflib", "psycopg", "pytest"):
              print(f"{package}=={version(package)}")
          PY

      - name: Verify immutable source and report manifests
        run: |
          set -euo pipefail
          sha256sum -c inputs/normative/SHA256SUMS | tee reports/tests/post_remediation_input_checksums.txt
          sha256sum -c reports/OCOR_ADD_v1.2_SHA256SUMS | tee reports/tests/post_remediation_report_checksums.txt

      - name: Run complete post-remediation document harness
        run: |
          set -euo pipefail
          PY=ocor-runtime/.venv/bin/python
          "$PY" scripts/verify.py --add reports/OCOR_Architectural_Design_Document_v1.2_Candidate.md --json | tee reports/tests/post_remediation_verify.log
          mv reports/verify_report.json reports/tests/v12_verify_report_post_approval.json
          "$PY" reports/tests/test_v12_candidate.py | tee reports/tests/post_remediation_conformance.log
          "$PY" reports/tests/test_v12_semantics.py | tee reports/tests/post_remediation_semantics.log
          "$PY" reports/tests/test_v12_release_gate.py | tee reports/tests/post_remediation_release_gate.log
          "$PY" reports/tests/test_v12_approval_readiness.py | tee reports/tests/post_remediation_approval_readiness.log

      - name: Run governed OpenAPI 3.1 validation
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python reports/tests/validate_openapi_governed.py | tee reports/tests/post_remediation_openapi.log

      - name: Run complete runtime, BA, EV and live PostgreSQL campaigns
        working-directory: ocor-runtime
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          # OCOR-DEV-0048 is a CONDITIONAL_INFRASTRUCTURE_GUARD (TEST-INFRA-005 in
          # reports/development/METHOD_COMPLIANCE.json). The SPIRE/SPIFFE workload
          # identity stack (bootstrap credentials + digest-pinned server and agent) is
          # provisioned above, so the real-backend provider tests run here with zero skip
          # (OCOR-DEV-REM-0017) instead of relying on the sealed local-stack G4 run.
          "$PY" -m pytest -v --cov=src --cov-report=term-missing --cov-report=json:../reports/tests/runtime_coverage_post_approval.json --junitxml=../reports/tests/runtime_junit_post_approval.xml tests/ | tee ../reports/tests/post_remediation_runtime.log
          "$PY" -m pytest -v --junitxml=../reports/tests/ba_junit_post_approval.xml tests/backend_assumptions/ | tee ../reports/tests/post_remediation_ba.log
          "$PY" -m pytest -v --junitxml=../reports/tests/ev_junit_post_approval.xml tests/acceptance_ev/ | tee ../reports/tests/post_remediation_ev.log
          "$PY" -m pytest -v --junitxml=../reports/tests/postgres_junit_post_approval.xml tests/integration/test_postgres_outbox_live.py | tee ../reports/tests/post_remediation_postgres.log

      - name: Build governed closure evidence
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python reports/tests/build_validation_closure_report.py

      - name: Verify DEC-208 authoritative promotion
        run: |
          set -euo pipefail
          python reports/tests/build_dec208_approval_manifest.py
          python reports/tests/verify_dec208_authoritative_promotion.py
          ocor-runtime/.venv/bin/python reports/tests/validate_openapi_remediation_c.py

      - name: Upload immutable evidence candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocor-validation-closure-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            reports/OCOR_ADD_v1.2_Validation_Closure_Report.md
            reports/tests/*post_approval*
            reports/tests/post_remediation_*.log
            reports/tests/post_remediation_*checksums.txt
            reports/tests/openapi_31_validation_results.json
            reports/tests/validation_closure_results.json
            reports/tests/v12_conformance_results.json
            reports/tests/v12_semantic_results.json
            reports/tests/v12_release_gate_results.json
            reports/tests/v12_approval_readiness_results.json
            reports/tests/dec208_authoritative_promotion_results.json
            ocor-runtime/docs/governance_dossier/OCOR_ADD_v1.3_APPROVAL_SHA256SUMS
