name: OCOR autonomous delivery controls

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ocor
          POSTGRES_PASSWORD: ocor
          POSTGRES_DB: ocor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocor -d ocor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      typedb:
        image: typedb/typedb@sha256:7555df2fffd5354553143facbfc81a58ce7036e4cc8b3b50bc7139faff4a721f
        ports:
          - 1729:1729
          - 8000:8000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1729'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      OCOR_LIVE_POSTGRES_DSN: postgresql://ocor:ocor@127.0.0.1:5432/ocor
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and start Fuseki
        run: |
          set -euo pipefail
          docker build -t ocor/jena-fuseki:ci infra/fuseki
          docker run -d --name fuseki -p 3030:3030 ocor/jena-fuseki:ci
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:3030/$/ping >/dev/null; do sleep 2; done'

      - name: Start real identity/policy control-plane services (OPA, Keycloak, OpenBao)
        run: |
          set -euo pipefail
          docker run -d --name opa -p 8181:8181 \
            openpolicyagent/opa@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff \
            run --server --addr 0.0.0.0:8181
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ocor-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-password \
            quay.io/keycloak/keycloak@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067 \
            start-dev --http-port=8080
          docker run -d --name openbao -p 8200:8200 --cap-add=IPC_LOCK \
            -e BAO_ADDR=http://127.0.0.1:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID=ci-only-token \
            quay.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641 \
            server -dev -dev-listen-address=0.0.0.0:8200
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8181/health >/dev/null; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080/realms/master/.well-known/openid-configuration >/dev/null; do sleep 3; done'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Set up pinned Node oracle
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Synchronize frozen test environment
        working-directory: ocor-runtime
        run: uv sync --frozen --extra test

      - name: Reject immutable-path and task-ledger regressions
        run: >-
          ocor-runtime/.venv/bin/python scripts/validate_ocor_change_scope.py
          --base "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"
          --head "${{ github.sha }}"
          --branch "${{ github.head_ref || github.ref_name }}"

      - name: Validate language policy (DEC-212)
        run: |
          ocor-runtime/.venv/bin/python -m unittest -v reports.tests.test_validate_language_policy
          ocor-runtime/.venv/bin/python scripts/validate_language_policy.py

      - name: Validate approved development plan and runner
        run: |
          set -euo pipefail
          PY=ocor-runtime/.venv/bin/python
          "$PY" scripts/ocor_autonomous_delivery.py --validate
          "$PY" scripts/ocor_autonomous_delivery.py --dry-run
          "$PY" scripts/ocor_autonomous_delivery.py --next

      - name: Test repository protection and runner controls
        run: >-
          uv run --project ocor-runtime --frozen pytest -q
          ocor-runtime/tests/tasks/test_ocor_dev_0001.py

      - name: Execute complete runtime suite with PostgreSQL
        run: >-
          uv run --project ocor-runtime --frozen pytest -q
          --junitxml=reports/tests/activation_runtime_junit.xml
          ocor-runtime/tests/

      - name: Lint approved planning Markdown
        run: >-
          npx --yes markdownlint-cli2@0.18.1
          'docs/development_plan/*.md' 'reports/planning/*.md'

      - name: Validate and render Mermaid DAG
        run: >-
          npx --yes @mermaid-js/mermaid-cli@11.12.0
          --input docs/development_plan/OCOR_DEPENDENCY_DAG.mmd
          --output /tmp/ocor-dependency-dag.svg
          --puppeteerConfigFile .github/mermaid-puppeteer.json
          --quiet
