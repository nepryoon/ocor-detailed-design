name: OCOR RCCAD methodology gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rccad-methodology:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: ocor
          POSTGRES_PASSWORD: ocor
          POSTGRES_USER: ocor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocor -d ocor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OCOR_LIVE_POSTGRES_DSN: postgresql://ocor:ocor@127.0.0.1:5432/ocor
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and start Fuseki
        run: |
          set -euo pipefail
          docker build -t ocor/jena-fuseki:ci infra/fuseki
          docker run -d --name ocor-bootstrap-fuseki-1 -p 3030:3030 ocor/jena-fuseki:ci
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:3030/$/ping >/dev/null; do sleep 2; done'
      - name: Pre-pull pinned service images (bounded retry)
        run: |
          set -euo pipefail
          pull_with_retry() {
            ref="$1"; attempt=1; max=5
            until docker pull "$ref"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "docker pull failed after ${max} attempts: ${ref}" >&2
                return 1
              fi
              echo "docker pull attempt ${attempt} failed for ${ref}; retrying in $((attempt * attempt))s" >&2
              sleep "$((attempt * attempt))"
              attempt="$((attempt + 1))"
            done
          }
          pull_with_retry typedb/typedb@sha256:7555df2fffd5354553143facbfc81a58ce7036e4cc8b3b50bc7139faff4a721f
          pull_with_retry openpolicyagent/opa@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff
          pull_with_retry quay.io/keycloak/keycloak@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
          pull_with_retry quay.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641

      - name: Start real TypeDB
        run: |
          set -euo pipefail
          docker run -d --name ocor-bootstrap-typedb-1 -p 1729:1729 -p 8000:8000 \
            typedb/typedb@sha256:7555df2fffd5354553143facbfc81a58ce7036e4cc8b3b50bc7139faff4a721f
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 2; done'
      - name: Start real identity/policy control-plane services (OPA, Keycloak, OpenBao)
        run: |
          set -euo pipefail
          docker run -d --name ocor-bootstrap-opa-1 -p 8181:8181 \
            openpolicyagent/opa@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff \
            run --server --addr 0.0.0.0:8181
          docker run -d --name ocor-bootstrap-keycloak-1 -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ocor-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-password \
            quay.io/keycloak/keycloak@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067 \
            start-dev --http-port=8080
          docker run -d --name ocor-bootstrap-openbao-1 -p 8200:8200 --cap-add=IPC_LOCK \
            -e BAO_ADDR=http://127.0.0.1:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID=ci-only-token \
            quay.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641 \
            server -dev -dev-listen-address=0.0.0.0:8200
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8181/health >/dev/null; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080/realms/master/.well-known/openid-configuration >/dev/null; do sleep 3; done'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - name: Synchronize pinned validation environment
        working-directory: ocor-runtime
        run: uv sync --frozen --extra test
      - name: Meta-validate schema and validate methodology instance
        run: |
          ocor-runtime/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path.cwd()
          schema = json.loads((root / "docs/development_methodology/methodology.schema.json").read_text())
          instance = json.loads((root / "docs/development_methodology/methodology.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(instance)
          PY
      - name: Validate RCCAD manifest, state, evidence and fitness functions
        run: >-
          ocor-runtime/.venv/bin/python scripts/validate_rccad.py
          --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"
      - name: Run RCCAD positive and negative acceptance tests
        run: ocor-runtime/.venv/bin/python -m unittest -v reports.tests.test_rccad_methodology
      - name: Validate language policy (DEC-212)
        run: |
          ocor-runtime/.venv/bin/python -m unittest -v reports.tests.test_validate_language_policy
          ocor-runtime/.venv/bin/python scripts/validate_language_policy.py
      - name: Validate authoritative execution runner
        run: |
          ocor-runtime/.venv/bin/python scripts/ocor_autonomous_delivery.py --validate
          ocor-runtime/.venv/bin/python scripts/ocor_autonomous_delivery.py --dry-run
      - name: Execute dynamic architecture fitness portfolio
        run: >-
          uv run --project ocor-runtime --frozen pytest -q
          ocor-runtime/tests/tasks/test_ocor_dev_0004.py
          ocor-runtime/tests/tasks/test_ocor_dev_0007.py
          ocor-runtime/tests/tasks/test_ocor_dev_0008.py
          ocor-runtime/tests/tasks/test_ocor_dev_0009.py
          ocor-runtime/tests/tasks/test_ocor_dev_0010.py
          ocor-runtime/tests/tasks/test_ocor_dev_0011.py
          ocor-runtime/tests/tasks/test_ocor_dev_0012.py
          ocor-runtime/tests/tasks/test_ocor_dev_0013.py
          ocor-runtime/tests/tasks/test_ocor_dev_0014.py
      - name: Execute full runtime regression with real PostgreSQL
        run: >-
          uv run --project ocor-runtime --frozen pytest -q
          --junitxml=reports/tests/rccad_runtime_junit.xml
          ocor-runtime/tests/
      - name: Prove immutable normative inputs
        run: git diff --exit-code "${{ github.event.pull_request.base.sha || 'origin/main' }}" -- inputs/
