server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire/sockets/server.sock"
  trust_domain = "ocor.test"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  ca_subject {
    country = ["IT"]
    organization = ["OCOR Test"]
    common_name = "OCOR SPIRE Test CA"
  }
}
plugins {
  DataStore "sql" {
    plugin_data { database_type = "sqlite3" connection_string = "/run/spire/data/datastore.sqlite3" }
  }
  NodeAttestor "join_token" { plugin_data {} }
  KeyManager "disk" {
    plugin_data { keys_path = "/run/spire/data/keys.json" }
  }
  UpstreamAuthority "disk" {
    plugin_data {
      cert_file_path = "/run/spire/bootstrap/ca.crt"
      key_file_path = "/run/spire/bootstrap/ca.key"
    }
  }
}
