name: ocor-bootstrap

x-policy: &policy
  restart: "no"
  init: true
  security_opt: ["no-new-privileges:true"]
  networks: [ocor-bootstrap]

services:
  terminusdb:
    <<: *policy
    image: terminusdb/terminusdb-server@sha256:58f829d5a96b3bc8e63811270c766ea4603fae0c948dced724de481461b4d073
    environment:
      TERMINUSDB_ADMIN_PASS: ${OCOR_LOCAL_TERMINUSDB_PASSWORD:?required}
    ports: ["127.0.0.1:6363:6363"]
    tmpfs: ["/app/terminusdb/storage:size=512m,mode=0700,uid=1000,gid=1000"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; socket.create_connection((\"127.0.0.1\",6363),2).close()'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    deploy: {resources: {limits: {memory: 2G, cpus: "2.0"}}}

  typedb:
    <<: *policy
    image: typedb/typedb@sha256:7555df2fffd5354553143facbfc81a58ce7036e4cc8b3b50bc7139faff4a721f
    ports: ["127.0.0.1:1729:1729", "127.0.0.1:8000:8000"]
    tmpfs: ["/server/data:size=1g,mode=0700"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1729"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy: {resources: {limits: {memory: 4G, cpus: "2.0"}}}

  fuseki:
    <<: *policy
    image: ocor/jena-fuseki:6.2.0
    build: {context: ../../infra/fuseki}
    ports: ["127.0.0.1:3030:3030"]
    tmpfs: ["/var/lib/fuseki:size=512m,mode=0700,uid=10001,gid=0"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3030/$/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    deploy: {resources: {limits: {memory: 2G, cpus: "2.0"}}}

  opa:
    <<: *policy
    image: openpolicyagent/opa@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff
    command: ["run", "--server", "--addr", "0.0.0.0:8181"]
    ports: ["127.0.0.1:8181:8181"]
    healthcheck: {test: ["CMD", "/opa", "eval", "true"], interval: 5s, timeout: 3s, retries: 20}

  keycloak:
    <<: *policy
    image: quay.io/keycloak/keycloak@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ocor-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OCOR_LOCAL_KEYCLOAK_PASSWORD:?required}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    tmpfs: ["/opt/keycloak/data:size=512m,mode=0750,uid=1000,gid=1000"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy: {resources: {limits: {memory: 2G, cpus: "2.0"}}}

  openbao:
    <<: *policy
    image: quay.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    cap_add: ["IPC_LOCK"]
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_DEV_ROOT_TOKEN_ID: ${OCOR_LOCAL_OPENBAO_TOKEN:?required}
    ports: ["127.0.0.1:8200:8200"]
    healthcheck: {test: ["CMD", "bao", "status"], interval: 5s, timeout: 3s, retries: 20}

  spire-server:
    <<: *policy
    image: ghcr.io/spiffe/spire-server@sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - "./spire/server.conf:/run/spire/config/server.conf:ro"
      - "${OCOR_SPIRE_BOOTSTRAP_DIR:?required}:/run/spire/bootstrap:ro"
    tmpfs: ["/run/spire/data:size=128m,mode=0700,uid=1000,gid=1000", "/run/spire/sockets:size=16m,mode=0755,uid=1000,gid=1000"]
    healthcheck: {test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/sockets/server.sock"], interval: 5s, timeout: 3s, retries: 20}

  spire-agent:
    <<: *policy
    image: ghcr.io/spiffe/spire-agent@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
    command: ["-config", "/run/spire/config/agent.conf", "-joinToken", "${OCOR_SPIRE_JOIN_TOKEN:?required}"]
    depends_on: {spire-server: {condition: service_healthy}}
    volumes:
      - "./spire/agent.conf:/run/spire/config/agent.conf:ro"
      - "${OCOR_SPIRE_BOOTSTRAP_DIR:?required}:/run/spire/bootstrap:ro"
    tmpfs: ["/run/spire/data:size=128m,mode=0700", "/run/spire/sockets:size=16m,mode=0755"]

  postgresql:
    <<: *policy
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: ocor
      POSTGRES_USER: ocor
      POSTGRES_PASSWORD: ${OCOR_LOCAL_POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data:size=512m,mode=0700"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocor -d ocor"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  kafka:
    <<: *policy
    image: confluentinc/cp-kafka@sha256:24cdd3a7fa89d2bed150560ebea81ff1943badfa61e51d66bb541a6b0d7fb047
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports: ["127.0.0.1:19092:19092"]
    tmpfs: ["/var/lib/kafka/data:size=512m,mode=0750,uid=1000,gid=1000"]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "127.0.0.1:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  qdrant:
    <<: *policy
    image: qdrant/qdrant@sha256:d122138f76868edba68d36cb0833139c1d1761f00f09e48e61f8314196e6a4c6
    ports: ["127.0.0.1:16333:6333", "127.0.0.1:16334:6334"]
    tmpfs: ["/qdrant/storage:size=512m,mode=0750"]
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':18BD ' /proc/net/tcp"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  ocor-bootstrap:
    # Dedicated bridge plus loopback-only publications isolate the disposable
    # environment while keeping real backends reachable by host-side tests.
    driver: bridge
