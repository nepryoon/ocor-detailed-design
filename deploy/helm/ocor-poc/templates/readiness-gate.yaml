apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-readiness-gate
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: readiness-gate
spec:
  replicas: {{ .Values.operational.readinessGate.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: readiness-gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: readiness-gate
    spec:
      containers:
        - name: readiness-gate
          image: {{ .Values.operational.readinessGate.image }}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import socket, sys
                  targets = [("terminusdb",6363),("typedb",1729),("fuseki",3030),
                             ("opa",8181),("keycloak",8080),("openbao",8200),
                             ("postgresql",5432),("kafka",29092),("qdrant",6333)]
                  ok = True
                  for host, port in targets:
                      try:
                          socket.create_connection((host, port), 3).close()
                      except OSError:
                          ok = False
                  sys.exit(0 if ok else 1)
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [python3, -c, "import sys; sys.exit(0)"]
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-readiness-gate
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: readiness-gate
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: readiness-gate
  ports:
    - name: health
      port: 8080
      targetPort: 8080
