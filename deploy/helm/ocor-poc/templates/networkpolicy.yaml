# ADD v1.3 §6.1 / LLD v1.1 §5.1: default-deny ingress and egress for every pod of
# the namespace, then only the intra-site flows of `ocor.isolation.allowedFlows`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    {{- include "ocor-poc.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-intra-site
  labels:
    {{- include "ocor-poc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- with .Values.operational.dependencyCidr }}
    - to:
        - ipBlock: {cidr: {{ . }}}
      ports:
        {{- range $.Values.ocor.isolation.allowedFlows }}
        - {protocol: TCP, port: {{ .port }}}
        {{- end }}
    {{- end }}
