[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocor-runtime"
version = "0.1.0"
description = "Executable OCOR core semantic runtime and verification harness"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "grpcio-tools>=1.62",
  "openapi-spec-validator>=0.7.1",
  "psycopg[binary]==3.2.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "rdflib==7.1.4",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "c1_compiler",
  "c2_identity",
  "c3_store",
  "c4_marking",
  "c5_actions",
  "c6_capabilities",
  "c7_emission",
  "c8_agent",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "backend_assumption: backend assumption verification (BA-01 through BA-08)",
  "acceptance: acceptance evidence verification (EV-001 through EV-035)",
]
