openapi: 3.1.0
info:
  title: OCOR Governed Agent Memory API
  version: 1.0.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security:
  - mutualTLS: []
    workloadOAuth: [ocor.memory]
paths:
  /v1/memory/items:
    post:
      operationId: admitMemoryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryAdmissionRequest'}
      responses:
        '201': {$ref: '#/components/responses/MemoryReceipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/memory/items/{memory_item_id}/versions/{memory_version}:
    get:
      operationId: getMemoryItemVersion
      parameters:
        - {$ref: '#/components/parameters/MemoryItemId'}
        - {$ref: '#/components/parameters/MemoryVersion'}
      responses:
        '200': {$ref: '#/components/responses/MemoryItem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/memory/search:
    post:
      operationId: searchMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemorySearchRequest'}
      responses:
        '200': {$ref: '#/components/responses/MemorySearchResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/memory/consolidations:
    post:
      operationId: consolidateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryConsolidationRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationReceipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/memory/items/{memory_item_id}/promotions:
    post:
      operationId: proposeMemoryPromotion
      parameters:
        - {$ref: '#/components/parameters/MemoryItemId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryPromotionRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationReceipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/memory/items/{memory_item_id}/lifecycle:
    post:
      operationId: transitionMemoryLifecycle
      parameters:
        - {$ref: '#/components/parameters/MemoryItemId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryLifecycleRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationReceipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/memory/items/{memory_item_id}:
    delete:
      operationId: requestMemoryDeletion
      parameters:
        - {$ref: '#/components/parameters/MemoryItemId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryDeletionRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationReceipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/memory/context-assemblies:
    post:
      operationId: assembleMemoryContext
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryContextAssemblyRequest'}
      responses:
        '200': {$ref: '#/components/responses/MemoryContextAssembly'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    mutualTLS: {type: mutualTLS}
    workloadOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes: {ocor.memory: Governed memory operations}
  parameters:
    MemoryItemId:
      name: memory_item_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    MemoryVersion:
      name: memory_version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  responses:
    MemoryReceipt:
      description: Immutable admission receipt
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MemoryReceipt'}
    MemoryItem:
      description: Policy-filtered exact memory version
      content:
        application/json:
          schema: {$ref: './governed-memory-item.schema.json'}
    MemorySearchResponse:
      description: Policy-filtered memory search response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MemorySearchResponse'}
    MemoryContextAssembly:
      description: Replayable context-assembly receipt
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MemoryContextAssembly'}
    OperationReceipt:
      description: Accepted governed asynchronous operation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationReceipt'}
    Problem:
      description: Typed fail-closed problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Digest:
      type: string
      pattern: '^urn:sha256:[0-9a-f]{64}$'
    GovernedContext:
      $ref: './governed-context.schema.json'
    GovernedEnvelope:
      type: object
      required: [operation_id, governed_context, governed_context_digest, deadline]
      properties:
        operation_id: {type: string, minLength: 1}
        governed_context: {$ref: '#/components/schemas/GovernedContext'}
        governed_context_digest: {$ref: '#/components/schemas/Digest'}
        deadline: {type: string, format: date-time}
    MemoryAdmissionRequest:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/GovernedEnvelope'}
        - type: object
          required: [candidate]
          properties:
            candidate: {$ref: './governed-memory-item.schema.json'}
    MemoryReceipt:
      type: object
      additionalProperties: false
      required: [memory_item_id, memory_version, content_digest, lifecycle_status, governed_context_digest, audit_ref]
      properties:
        memory_item_id: {type: string, minLength: 1}
        memory_version: {type: integer, minimum: 1}
        content_digest: {$ref: '#/components/schemas/Digest'}
        lifecycle_status: {type: string, minLength: 1}
        governed_context_digest: {$ref: '#/components/schemas/Digest'}
        audit_ref: {type: string, minLength: 1}
    MemorySearchRequest:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/GovernedEnvelope'}
        - type: object
          required: [query_contract_id, query_contract_version, retrieval_mode, memory_kinds, memory_scopes, parameters, top_k, ranking_profile_ref]
          properties:
            query_contract_id: {type: string, minLength: 1}
            query_contract_version: {type: string, minLength: 1}
            retrieval_mode: {enum: [STRUCTURED, FULL_TEXT, VECTOR, HYBRID]}
            memory_kinds: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
            memory_scopes: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
            parameters: {type: object}
            valid_at: {type: string, format: date-time}
            top_k: {type: integer, minimum: 1, maximum: 100}
            ranking_profile_ref: {type: string, minLength: 1}
            include_explanation: {type: boolean, default: true}
    MemoryHit:
      type: object
      additionalProperties: false
      required: [memory_item_id, memory_version, content_ref, content_digest, final_score, score_factors, evidence_refs, provenance_refs, result_marking_ref]
      properties:
        memory_item_id: {type: string, minLength: 1}
        memory_version: {type: integer, minimum: 1}
        content_ref: {type: string, minLength: 1}
        content_digest: {$ref: '#/components/schemas/Digest'}
        final_score: {type: number}
        score_factors: {type: object, additionalProperties: {type: number}}
        evidence_refs: {type: array, minItems: 1, items: {type: string}}
        provenance_refs: {type: array, minItems: 1, items: {type: string}}
        result_marking_ref: {$ref: '#/components/schemas/Digest'}
        explanation_ref: {type: string}
    MemorySearchResponse:
      type: object
      additionalProperties: false
      required: [query_digest, retrieval_mode, ranking_profile_ref, hits, governed_context_digest, audit_ref]
      properties:
        query_digest: {$ref: '#/components/schemas/Digest'}
        retrieval_mode: {enum: [STRUCTURED, FULL_TEXT, VECTOR, HYBRID]}
        ranking_profile_ref: {type: string, minLength: 1}
        hits: {type: array, items: {$ref: '#/components/schemas/MemoryHit'}}
        governed_context_digest: {$ref: '#/components/schemas/Digest'}
        audit_ref: {type: string, minLength: 1}
    MemoryConsolidationRequest:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/GovernedEnvelope'}
        - type: object
          required: [input_query_digest, input_item_refs, algorithm_ref, algorithm_digest, target_memory_kind, target_memory_scope, reviewer_policy_ref]
          properties:
            input_query_digest: {$ref: '#/components/schemas/Digest'}
            input_item_refs: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
            algorithm_ref: {type: string, minLength: 1}
            algorithm_digest: {$ref: '#/components/schemas/Digest'}
            target_memory_kind: {type: string, minLength: 1}
            target_memory_scope: {type: string, minLength: 1}
            reviewer_policy_ref: {type: string, minLength: 1}
    MemoryPromotionRequest:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/GovernedEnvelope'}
        - type: object
          required: [memory_version, target_aggregate_type, target_aggregate_ref, proposal_schema_ref]
          properties:
            memory_version: {type: integer, minimum: 1}
            target_aggregate_type: {type: string, minLength: 1}
            target_aggregate_ref: {type: string, minLength: 1}
            proposal_schema_ref: {type: string, minLength: 1}
    MemoryLifecycleRequest:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/GovernedEnvelope'}
        - type: object
          required: [memory_version, target_status, reason_code]
          properties:
            memory_version: {type: integer, minimum: 1}
            target_status: {type: string, minLength: 1}
            reason_code: {type: string, minLength: 1}
            legal_hold_ref: {type: string, minLength: 1}
    MemoryDeletionRequest:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/GovernedEnvelope'}
        - type: object
          required: [reason_code, deletion_scope]
          properties:
            reason_code: {type: string, minLength: 1}
            deletion_scope: {enum: [LATEST_VERSION, ALL_VERSIONS, PROJECT_SCOPE, PRINCIPAL_SCOPE]}
    MemoryContextAssemblyRequest:
      unevaluatedProperties: false
      allOf:
        - {$ref: '#/components/schemas/GovernedEnvelope'}
        - type: object
          required: [search_request, target_model_ref, max_context_bytes, rendering_profile_ref]
          properties:
            search_request: {$ref: '#/components/schemas/MemorySearchRequest'}
            target_model_ref: {type: string, minLength: 1}
            max_context_bytes: {type: integer, minimum: 1}
            rendering_profile_ref: {type: string, minLength: 1}
    MemoryContextAssembly:
      type: object
      additionalProperties: false
      required: [assembly_id, query_digest, selected_item_version_refs, redaction_refs, ordering_profile_ref, truncation_record, context_ref, context_digest, governed_context_digest, audit_ref]
      properties:
        assembly_id: {type: string, minLength: 1}
        query_digest: {$ref: '#/components/schemas/Digest'}
        selected_item_version_refs: {type: array, uniqueItems: true, items: {type: string}}
        redaction_refs: {type: array, uniqueItems: true, items: {type: string}}
        ordering_profile_ref: {type: string, minLength: 1}
        truncation_record: {type: object}
        context_ref: {type: string, minLength: 1}
        context_digest: {$ref: '#/components/schemas/Digest'}
        governed_context_digest: {$ref: '#/components/schemas/Digest'}
        audit_ref: {type: string, minLength: 1}
    OperationReceipt:
      type: object
      additionalProperties: false
      required: [operation_id, operation_kind, status, governed_context_digest, audit_ref]
      properties:
        operation_id: {type: string, minLength: 1}
        operation_kind: {type: string, minLength: 1}
        status: {enum: [ACCEPTED, COMPLETED, FAILED, INDETERMINATE]}
        governed_context_digest: {$ref: '#/components/schemas/Digest'}
        audit_ref: {type: string, minLength: 1}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, reason_code, correlation_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        reason_code:
          enum: [AUTHENTICATION_REQUIRED, GOVERNED_CONTEXT_MISMATCH, POLICY_DENIED, AUTHORITY_DENIED, MEMORY_NOT_FOUND, MEMORY_VERSION_NOT_FOUND, MEMORY_SCHEMA_INVALID, MEMORY_IDEMPOTENCY_CONFLICT, MEMORY_TAINTED, REPRESENTATION_NOT_READY, UNSUPPORTED_CAPABILITY, LIFECYCLE_TRANSITION_INVALID, LEGAL_HOLD_ACTIVE, DELETION_INCOMPLETE, STALE_POLICY, STOP_EPOCH_MISMATCH, CONTROL_PLANE_UNAVAILABLE, INTERNAL_ERROR]
        correlation_id: {type: string, minLength: 1}
